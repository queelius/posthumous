[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posthumous"
version = "0.8.0"
description = "A lightweight, federated deadman switch that triggers notifications and scripts when you stop checking in"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alex Towell", email = "lex@metafunctor.com" }
]
keywords = ["deadman-switch", "notifications", "scheduler", "federated", "totp", "watchdog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "apprise>=1.6.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "aiohttp>=3.9",
    "python-dateutil>=2.8",
    "qrcode>=7.4",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "aioresponses>=0.7",
    "freezegun>=1.2",
]

[project.urls]
Homepage = "https://github.com/queelius/posthumous"
Repository = "https://github.com/queelius/posthumous"
Issues = "https://github.com/queelius/posthumous/issues"
Changelog = "https://github.com/queelius/posthumous/releases"

[project.scripts]
posthumous = "posthumous.cli:main"
phm = "posthumous.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/posthumous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/posthumous --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["src/posthumous"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
